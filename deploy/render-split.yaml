# Optional alternative to root render.yaml. Fill both origin variables in Render.
services:
  - type: web
    name: daketi-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
  - type: web
    name: daketi-table
    runtime: static
    buildCommand: npm ci --omit=dev && npm run build:static
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SKIP_INSTALL_DEPS
        value: true
      - key: DAKETI_API_URL
        sync: false
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /config.js
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
